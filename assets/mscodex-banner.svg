<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">MSCODEX — Lucas Costa</title>
  <desc id="desc">Banner preto e vermelho da MSCODEX, desenvolvimento web, bots e automações.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#160305"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b0000"/>
      <stop offset="0.5" stop-color="#ff1f2d"/>
      <stop offset="1" stop-color="#7a0008"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff1f2d" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ff1f2d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ff2433" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <ellipse cx="940" cy="145" rx="330" ry="260" fill="url(#glow)"/>
  <ellipse cx="175" cy="280" rx="250" ry="150" fill="#e60012" opacity=".08" filter="url(#shadow)"/>

  <path d="M0 34H350L395 0" fill="none" stroke="url(#red)" stroke-width="3"/>
  <path d="M1200 286H850L805 320" fill="none" stroke="url(#red)" stroke-width="3"/>
  <path d="M885 0L1200 0 1200 110" fill="none" stroke="#ff1f2d" stroke-opacity=".35"/>
  <path d="M0 210L145 210 185 250 415 250" fill="none" stroke="#ff1f2d" stroke-opacity=".14"/>

  <g transform="translate(72 68)">
    <rect width="78" height="78" rx="16" fill="#09090b" stroke="#ff2637" stroke-width="2"/>
    <path d="M25 20L12 39 25 58M53 20L66 39 53 58" fill="none" stroke="#ff2637" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="39" cy="39" r="5" fill="#fff"/>
  </g>

  <text x="176" y="116" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="3">MS<tspan fill="#ff2637" filter="url(#textGlow)">CODEX</tspan></text>
  <text x="76" y="176" fill="#d9d9dc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="1.3">LUCAS COSTA  •  DESENVOLVEDOR DE SOFTWARE</text>
  <rect x="76" y="205" width="520" height="2" fill="url(#red)"/>
  <text x="76" y="248" fill="#9e9ea5" font-family="Segoe UI,Arial,sans-serif" font-size="18">Sistemas web  •  Bots  •  Automações  •  Integrações</text>

  <g transform="translate(870 95)">
    <rect width="240" height="120" rx="18" fill="#09090b" fill-opacity=".82" stroke="#ff2637" stroke-opacity=".42"/>
    <circle cx="28" cy="31" r="5" fill="#ff2637"/>
    <text x="45" y="38" fill="#f5f5f5" font-family="Consolas,monospace" font-size="17">build.solution()</text>
    <text x="25" y="73" fill="#7d7d85" font-family="Consolas,monospace" font-size="14">status:</text>
    <text x="92" y="73" fill="#ff4a57" font-family="Consolas,monospace" font-size="14">online</text>
    <text x="25" y="98" fill="#7d7d85" font-family="Consolas,monospace" font-size="14">brand:</text>
    <text x="92" y="98" fill="#fff" font-family="Consolas,monospace" font-size="14">MSCODEX</text>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="317" rx="22.5" fill="none" stroke="#ff2637" stroke-opacity=".28" stroke-width="3"/>
</svg>